<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Hero prototype B: Press check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.top{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:var(--header-h);padding:0 var(--margin);font-size:15px}
.top a{color:inherit;text-decoration:none;margin-left:28px} .top .cv{color:var(--accent)}
.hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.nm{font-family:var(--font);font-weight:800;font-variation-settings:"wdth" 68;mix-blend-mode:multiply}
.c{fill:#00AEEF}.m{fill:#EC008C}.y{fill:#FFE600}.k{fill:#151412}
.mark{fill:none;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.ready .draw{stroke-dashoffset:0;transition:stroke-dashoffset 900ms var(--ease-premium);transition-delay:calc(var(--i)*60ms)}
.chip{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.ready .chip{transform:none;transition:transform 500ms var(--ease-enter);transition-delay:calc(700ms + var(--i)*40ms)}
.slug{font:600 13px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.meta{position:absolute;left:var(--margin);right:var(--margin);bottom:clamp(20px,5vh,56px);display:flex;justify-content:space-between;align-items:end;gap:24px}
.meta .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.meta p.lede{font-size:clamp(17px,1.5vw,22px);line-height:1.4;max-width:34ch;margin:0}
.meta .hint{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.after{min-height:80vh;background:var(--ink);color:var(--muted-on-ink);padding:10vh var(--margin)}
@media (prefers-reduced-motion: reduce){.draw{stroke-dashoffset:0}.chip{transform:none}}
</style>
</head>
<body>
<header class="top"><b>Roberto Anduray</b><nav><a href="#">Work</a><a href="#">About</a><a class="cv" href="../assets/Roberto-Anduray-CV.pdf">Download CV</a></nav></header>
<section class="hero" aria-labelledby="name">
  <h1 id="name" style="position:absolute;left:-9999px">Roberto Anduray</h1>
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g id="marks"></g>
    <g id="plates"></g>
    <text class="slug" x="170" y="88">Anduray_portfolio_2026 &#183; Proof 1 of 24 &#183; C M Y K + PMS 173</text>
  </svg>
  <div class="meta">
    <div><p class="label">Senior Graphic Designer &amp; Creative Director, Port St. Lucie, FL</p>
    <p class="lede">I come up with the idea, write the line and make the picture, for brands people see every day.</p></div>
    <span class="hint">Move the cursor to knock the plates</span>
  </div>
</section>
<section class="after"><p>Work starts here (prototype ends).</p></section>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg', reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  // sheet trim box and printer's marks
  const marks = document.getElementById('marks'), T = { x: 120, y: 110, w: 1360, h: 640 };
  let i = 0; const line = (x1, y1, x2, y2) => { const l = el('line', { x1, y1, x2, y2, class: 'mark draw' }, marks); const len = Math.hypot(x2 - x1, y2 - y1); l.style.setProperty('--len', len); l.style.setProperty('--i', i++); };
  const L = 34, G = 12;
  for (const [cx, cy, sx, sy] of [[T.x, T.y, -1, -1], [T.x + T.w, T.y, 1, -1], [T.x, T.y + T.h, -1, 1], [T.x + T.w, T.y + T.h, 1, 1]]) {
    line(cx + sx * G, cy, cx + sx * (G + L), cy); line(cx, cy + sy * G, cx, cy + sy * (G + L));
  }
  for (const [cx, cy] of [[800, T.y - 46], [800, T.y + T.h + 46], [T.x - 52, T.y + T.h / 2], [T.x + T.w + 52, T.y + T.h / 2]]) {
    const c = el('circle', { cx, cy, r: 13, class: 'mark draw' }, marks); c.style.setProperty('--len', 82); c.style.setProperty('--i', i++);
    line(cx - 22, cy, cx + 22, cy); line(cx, cy - 22, cx, cy + 22);
  }
  const bar = ['#00AEEF', '#EC008C', '#FFE600', '#151412', '#B23516', '#7FD6F7', '#F57FC5', '#FFF27F', '#8A8986'];
  bar.forEach((f, k) => { const r = el('rect', { x: 1060 + k * 46, y: 826, width: 42, height: 22, fill: f, class: 'chip' }, marks); r.style.setProperty('--i', k); });
  // four plates of the name
  const plates = document.getElementById('plates'), P = [];
  [['y', -70, 64, -2.2], ['m', 64, 42, 1.6], ['c', -52, -46, -1.2], ['k', 88, -60, 2.4]].forEach(([cls, dx, dy, rot], k) => {
    const g = el('g', {}, plates);
    for (const [txt, yy] of [['ROBERTO', 410], ['ANDURAY', 700]]) {
      el('text', { class: 'nm ' + cls, x: 800, y: yy, 'text-anchor': 'middle', 'font-size': 330, textLength: 1240, lengthAdjust: 'spacingAndGlyphs' }, g).textContent = txt;
    }
    P.push({ g, from: { x: dx, y: dy, r: rot }, cur: { x: dx, y: dy, r: rot }, delay: k * 120, push: [14, -11, 8, 0][k] });
  });
  const put = (p, x, y, r) => p.g.setAttribute('transform', `translate(${x} ${y}) rotate(${r} 800 560)`);
  // damped spring into register (ratio 0.55, about 1.1s)
  const spring = (t) => { const z = 0.55, w = 11; if (t <= 0) return 1; return Math.exp(-z * w * t) * Math.cos(w * Math.sqrt(1 - z * z) * t); };
  let mx = 0, my = 0, sx = 0, sy = 0, t0 = null;
  addEventListener('pointermove', (e) => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  document.documentElement.addEventListener('pointerleave', () => { mx = my = 0; });
  const frame = (now) => {
    if (t0 === null) t0 = now;
    sx += (mx - sx) * .08; sy += (my - sy) * .08;
    const scroll = Math.min(1, scrollY / innerHeight);
    for (const p of P) {
      const s = reduce ? 0 : spring((now - t0 - p.delay) / 1000);
      const kick = reduce ? 0 : p.push, out = reduce ? 0 : scroll * 4;
      put(p, p.from.x * (s + out) + sx * kick * 4, p.from.y * (s + out) + sy * kick * 3, p.from.r * (s + out));
    }
    requestAnimationFrame(frame);
  };
  const go = () => { document.documentElement.classList.add('ready'); requestAnimationFrame(frame); };
  (document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 800))]) : Promise.resolve()).then(go);
})();
</script>
</body>
</html>
