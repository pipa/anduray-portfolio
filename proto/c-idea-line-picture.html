<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Hero prototype C: Idea, line, picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.top{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:var(--header-h);padding:0 var(--margin);font-size:15px;background:var(--paper)}
.top a{color:inherit;text-decoration:none;margin-left:28px} .top .cv{color:var(--accent)}
.hero{min-height:100vh;padding:calc(var(--header-h) + 2vh) var(--margin) 4vh;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gutter);align-items:center}
.left{grid-column:1/span 7;display:flex;flex-direction:column;gap:clamp(20px,3.4vh,40px)}
h1{margin:0;font-size:clamp(56px,9.6vw,184px);line-height:.8;font-weight:800;font-variation-settings:"wdth" 68;text-transform:uppercase;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter);list-style:none;margin:0;padding:0}
.steps li{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps li i{display:block;height:3px;background:var(--rule);margin-bottom:10px;overflow:hidden}
.steps li i b{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.steps li.on{color:var(--ink)}
.line{min-height:2.7em;font-size:clamp(28px,3.3vw,60px);line-height:.95;font-weight:800;font-variation-settings:"wdth" 68;text-transform:uppercase;margin:0}
.line span{opacity:0}.line span.v{opacity:1}
.cap{font-size:15px;color:var(--muted);margin:0;min-height:3em}
.cap b{color:var(--ink);font-weight:600}
.frame{grid-column:8/span 5;justify-self:end;height:min(80vh,calc((100vw*5/12)*1.36));aspect-ratio:900/1225;position:relative}
.frame svg{width:100%;height:100%;display:block}
.frame .tag{position:absolute;left:0;top:calc(100% + 10px);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:clamp(17px,1.4vw,21px);line-height:1.4;max-width:40ch;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
@media (max-width:900px){.left,.frame{grid-column:1/-1}.frame{justify-self:start;height:70vh;margin-top:24px}}
</style>
</head>
<body>
<header class="top"><b>Roberto Anduray</b><nav><a href="#">Work</a><a href="#">About</a><a class="cv" href="../assets/Roberto-Anduray-CV.pdf">Download CV</a></nav></header>
<section class="hero" aria-labelledby="name">
  <div class="left">
    <div><p class="label">Senior Graphic Designer &amp; Creative Director, Port St. Lucie, FL</p>
    <h1 id="name">Roberto<br>Anduray</h1></div>
    <ol class="steps" aria-hidden="true"><li><i><b></b></i>01 The idea</li><li><i><b></b></i>02 The line</li><li><i><b></b></i>03 The picture</li></ol>
    <p class="line" aria-live="off"></p>
    <p class="cap"></p>
  </div>
  <div class="frame">
    <svg viewBox="0 0 900 1225" role="img" aria-label="A poster going from pencil sketch to finished artwork">
      <defs>
        <mask id="scrib" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="1225"><path id="sp" fill="none" stroke="#fff" stroke-width="230" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
        <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="1225"><circle id="rc" cx="450" cy="760" r="820" fill="#fff"/></mask>
      </defs>
      <rect width="900" height="1225" fill="#FBF9F4"/>
      <rect width="900" height="1225" fill="none" stroke="#D8D2C4" stroke-width="2"/>
      <g id="art"><image id="sk" width="900" height="1225" preserveAspectRatio="xMidYMid slice" mask="url(#scrib)"/>
      <image id="fin" width="900" height="1225" preserveAspectRatio="xMidYMid slice" mask="url(#reveal)"/></g>
    </svg>
    <span class="tag"></span>
  </div>
</section>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = [
    { img: 'montanita-5', cx: 450, cy: 720, line: '“Me vi al espejo y no reconocí a ese hombre”', en: '“I looked in the mirror and didn’t recognise that man.”', who: 'El Heraldo · La Montañita fire special edition' },
    { img: 'dengue-1', cx: 420, cy: 560, line: 'El mosquito del dengue no es tu amigo.', en: 'The dengue mosquito is not your friend.', who: 'El Heraldo · Dengue awareness series' },
    { img: 'estilo-5', cx: 600, cy: 520, line: '¡Así debes tocarte!', en: 'This is how to check yourself.', who: 'Estilo magazine · Breast self-exam campaign' },
  ];
  // seeded scribble that covers the sheet in loose zig-zags
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  let d = 'M 40 60'; for (let y = 60, k = 0; y < 1260; y += 105, k++) { const x = k % 2 ? 60 + rnd() * 40 : 840 - rnd() * 40; d += ` Q ${450 + (rnd() - .5) * 200} ${y + 20 + rnd() * 40} ${x} ${y + 105}`; }
  document.getElementById('sp').setAttribute('d', d);
  const $ = (s) => document.querySelector(s), sp = $('#sp'), rc = $('#rc'), sk = $('#sk'), fin = $('#fin'), art = $('#art');
  const lineEl = $('.line'), cap = $('.cap'), tag = $('.tag'), bars = [...document.querySelectorAll('.steps b')], lis = [...document.querySelectorAll('.steps li')];
  // timings (ms) per piece
  const T = { sketch: 1800, line: 1500, pic: 1000, hold: 2600, out: 400 }; const PER = T.sketch + T.line + T.pic + T.hold + T.out;
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const quart = (t) => t < .5 ? 8 * t ** 4 : 1 - (-2 * t + 2) ** 4 / 2, expo = (t) => t === 1 ? 1 : 1 - 2 ** (-10 * t);
  let cur = -1, spans = [];
  const setPiece = (i) => {
    const w = W[i]; cur = i;
    sk.setAttribute('href', `sketch-${w.img}.webp`); fin.setAttribute('href', `../assets/work/${w.img}.webp`);
    rc.setAttribute('cx', w.cx); rc.setAttribute('cy', w.cy); rc.style.transformOrigin = `${w.cx}px ${w.cy}px`;
    lineEl.innerHTML = ''; spans = [...w.line].map((ch) => { const s = document.createElement('span'); s.textContent = ch; lineEl.appendChild(s); return s; });
    lineEl.setAttribute('lang', 'es'); cap.innerHTML = `<b>${w.en}</b><br>${w.who}`; tag.textContent = `${String(i + 1).padStart(2, '0')} / ${String(W.length).padStart(2, '0')}`;
  };
  // every frame is a pure function of t
  window.renderAt = (t) => {
    const i = Math.floor(t / PER) % W.length, u = t % PER; if (i !== cur) setPiece(i);
    const a = clamp(u / T.sketch), b = clamp((u - T.sketch) / T.line), c = clamp((u - T.sketch - T.line) / T.pic);
    const o = clamp((u - PER + T.out) / T.out);
    sp.setAttribute('stroke-dashoffset', 1 - quart(a));
    const n = Math.round(expo(b) * spans.length); spans.forEach((s, k) => s.classList.toggle('v', k < n));
    rc.style.transform = `scale(${quart(c)})`;
    art.style.opacity = 1 - o; lineEl.style.opacity = 1 - o; cap.style.opacity = c > 0 ? 1 - o : clamp(b * 3) * (1 - o);
    [a, b, c].forEach((v, k) => { bars[k].style.transform = `scaleX(${v})`; lis[k].classList.toggle('on', v > 0 && v < 1 || (k === 2 && v === 1)); });
  };
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { window.renderAt(+q.get('t')); return; }
  if (reduce) { window.renderAt(T.sketch + T.line + T.pic + 10); return; }
  let t0 = null; const loop = (now) => { if (t0 === null) t0 = now; window.renderAt(now - t0); requestAnimationFrame(loop); };
  (document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 800))]) : Promise.resolve()).then(() => requestAnimationFrame(loop));
})();
</script>
</body>
</html>
